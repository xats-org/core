name: Release

on:
  push:
    branches:
      - main
      - v0.4.0
      - v0.5.0
      - v0.6.0
      - v0.7.0

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      deployments: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        
      - name: Build core packages first
        run: |
          # Build dependencies in order
          pnpm --filter @xats-org/types run build
          pnpm --filter @xats-org/utils run build
          pnpm --filter @xats-org/schema run build
          pnpm --filter @xats-org/validator run build
          # Now build CLI and MCP server packages
          pnpm --filter @xats-org/cli run build
          pnpm --filter @xats-org/mcp-server run build

      - name: Build Packages
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Create NPM Deployment
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'npm-production',
                description: 'Publishing packages to npm',
                auto_merge: false,
                required_contexts: [],
                production_environment: true
              });
              
              if (deployment.status === 201) {
                core.setOutput('id', deployment.data.id);
                console.log(`Created deployment ${deployment.data.id}`);
                
                // Set initial status to in_progress
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.data.id,
                  state: 'in_progress',
                  description: 'Publishing packages to npm...',
                  environment_url: 'https://www.npmjs.com/org/xats-org'
                });
              }
            } catch (error) {
              console.log('Could not create deployment, likely due to branch protection.');
              console.log('Continuing without deployment tracking.');
              core.setOutput('id', '');
            }

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update Deployment Status
        if: steps.changesets.outputs.published == 'true' && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = ${{ steps.deployment.outputs.id }};
            const publishedPackages = ${{ steps.changesets.outputs.publishedPackages }};
            
            // Extract version from first package
            const version = publishedPackages[0]?.version || 'unknown';
            const packageCount = publishedPackages.length;
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              description: `Successfully published ${packageCount} packages (v${version})`,
              environment_url: 'https://www.npmjs.com/org/xats-org'
            });
            
            console.log(`Updated deployment ${deploymentId} to success`);

      - name: Update Deployment Status on Failure
        if: failure() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = ${{ steps.deployment.outputs.id }};
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'failure',
              description: 'Failed to publish packages to npm',
              environment_url: 'https://www.npmjs.com/org/xats-org'
            });
            
            console.log(`Updated deployment ${deploymentId} to failure`);

      - name: Post Release Steps
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Packages were published successfully!"
          echo "Published packages: ${{ steps.changesets.outputs.publishedPackages }}"