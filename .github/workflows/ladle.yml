name: Component Documentation (Ladle)

on:
  workflow_dispatch:  # Allow manual triggering
  push:
    branches:
      - main
      - 'v*.*.*'
    paths:
      - 'packages/*/src/**'
      - '.ladle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
      - 'v*.*.*'
    paths:
      - 'packages/*/src/**'
      - '.ladle/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  build-ladle:
    name: Build Ladle
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        
    - name: Install dependencies without bin links
      run: pnpm install --frozen-lockfile --ignore-scripts
      
    - name: Build core packages first
      run: |
        # Build dependencies in order
        pnpm --filter @xats-org/types run build
        pnpm --filter @xats-org/utils run build
        pnpm --filter @xats-org/schema run build
        pnpm --filter @xats-org/validator run build
        # Now build CLI and MCP server packages
        pnpm --filter @xats-org/cli run build
        pnpm --filter @xats-org/mcp-server run build
      
    - name: Build remaining packages
      run: pnpm run build
      
    - name: Build Ladle
      run: pnpm run ladle:build
      
    - name: Upload Ladle artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ladle-static
        path: ladle-build
        retention-days: 7
        
  test-ladle:
    name: Test Ladle
    runs-on: ubuntu-latest
    needs: [build-ladle]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts
      
    - name: Download Ladle artifacts
      uses: actions/download-artifact@v5
      with:
        name: ladle-static
        path: ladle-build
        
    - name: Run Ladle tests
      run: |
        echo "Ladle test setup pending - skipping for now"
        # TODO: Add proper test setup with playwright
        # npx playwright install --with-deps
        # npx http-server ladle-build --port 61000 --silent &
        # npx wait-on http://localhost:61000
        # Add custom Ladle testing if needed
        
  deploy-ladle:
    name: Deploy Ladle to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-ladle]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Download Ladle artifacts
      uses: actions/download-artifact@v5
      with:
        name: ladle-static
        path: ladle-build
        
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload to Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ladle-build
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4